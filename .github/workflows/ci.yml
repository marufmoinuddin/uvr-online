name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m py_compile main.py backend.py job_queue.py model_manager.py sep_worker.py

  # CPU mode is a supported deployment, not a fallback nobody tests. The CPU
  # wheels are a fraction of the CUDA ones, so this job stays quick — and it
  # runs the REAL path: the device setting, the catalogue guard, and an
  # actual separation whose stems are checked.
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        run: pip install -r api/requirements-cpu.txt
      - name: Install ffmpeg
        # audio-separator refuses to start without ffmpeg ("FFmpeg is not
        # installed"), and the separation stage of the test would die on
        # FileNotFoundError: 'ffmpeg' — this runner image has none.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: CPU-mode tests
        env:
          # Pinned so the job cannot pass by running on a GPU. The runner has
          # no GPU, but the environment should say what it means.
          UVR_DEVICE: cpu
        run: python scripts/test-cpu-mode.py --full

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Build the CPU worker image
        # The CPU image is published separately (see docker.yml); building it
        # here means a broken CPU Dockerfile fails the pull request rather
        # than the release pipeline.
        run: docker build -f api/Dockerfile.cpu -t uvr-api-cpu:ci api/

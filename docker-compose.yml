services:
  web:
    build:
      context: ./web
      args:
        # NEXT_PUBLIC_* is inlined at BUILD time. Point the browser straight at
        # the worker's published port so the live job socket connects; the app
        # falls back to proxy polling if it cannot.
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    environment:
      # Server-side proxy target. Inside the compose network the worker is
      # reachable by SERVICE NAME — `localhost` here would resolve to this
      # container and every /api/* proxy call would fail.
      # Note: NEXT_PUBLIC_API_URL is intentionally NOT set, so the browser keeps
      # using same-origin /api/* (which also gets gzip + ETag from the proxy).
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      - api

  api:
    build: ./api
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./api:/app
      - ~/music:/data/input:ro
      - ./output:/data/output
      # Model cache, bind-mounted read-write so weights live in ./models on the
      # host — inspectable, seedable by hand (drop in a pre-downloaded
      # <model_id>/ folder) and persistent across rebuilds.
      - ./models:/data/models
    environment:
      - OUTPUT_ROOT=/data/output
      - MODEL_CATALOG=/app/models.json
      - MODEL_STORE=/data/models
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
    # Standalone inference: no external MSST-WebUI checkout is mounted.

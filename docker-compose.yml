services:
  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

  api:
    build: ./api
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./api:/app
      - ~/music:/data/input:ro
      - ./output:/data/output
      # MSST-WebUI checkout (primary inference backend). Models auto-download
      # into its pretrain/ dir on first use.
      - ${MSST_ROOT:-/home/maruf/git/MSST-WebUI}:/msst:ro
      - model_weights:/msst/pretrain
    environment:
      - MSST_ROOT=/msst
      - OUTPUT_ROOT=/data/output
      - MODEL_CATALOG=/app/models.json
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128

volumes:
  model_weights: